name: dozer-banking-chatbot
services:
  postgres:
    image: postgres:15.10
    environment:
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank
      POSTGRES_DB: bank
    command: [postgres, -c, wal_level=logical, -c, max_replication_slots=10]
    ports: ["127.0.0.1:55432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./data/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U bank -d bank"]
      interval: 3s
      timeout: 3s
      retries: 20
  clickhouse:
    image: clickhouse/clickhouse-server:24.8.14.39-alpine
    environment:
      CLICKHOUSE_USER: bank
      CLICKHOUSE_PASSWORD: bank
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports: ["127.0.0.1:59000:9000"]
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: [CMD-SHELL, "clickhouse-client --user bank --password bank --query 'SELECT 1'"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      target: api
    environment:
      API_HOST: 0.0.0.0
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: bank
      CLICKHOUSE_PASSWORD: bank
    ports: ["127.0.0.1:58000:8000"]
    depends_on:
      clickhouse:
        condition: service_healthy
  ollama:
    image: ollama/ollama:0.11.10
    ports: ["127.0.0.1:11434:11434"]
    volumes:
      - ollama-data:/root/.ollama
  chat:
    profiles: [tools]
    build:
      context: .
      target: chatbot
    environment:
      PROFILE_API_URL: http://api:8000
      OLLAMA_BASE_URL: http://ollama:11434
      CHAT_MODEL: ${CHAT_MODEL:-llama3.2:3b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      CHROMA_DIR: /index
    volumes:
      - chroma-data:/index
    stdin_open: true
    tty: true
    depends_on: [api, ollama]
volumes:
  postgres-data:
  clickhouse-data:
  ollama-data:
  chroma-data:
